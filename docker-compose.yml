name: spotify_db

services:
  postgres:
    image: postgres:16-alpine
    container_name: spotify_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-musicdb}
      POSTGRES_USER: ${DB_USER:-yorch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Y0rch8mN2qLp7sTx}
    ports:
      - "${DB_BIND_IP:?Set DB_BIND_IP in .env}:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yorch} -d ${DB_NAME:-musicdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: spotify_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "python /app/scripts/bootstrap_api.py && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-musicdb}
      DB_USER: ${DB_USER:-yorch}
      DB_PASSWORD: ${DB_PASSWORD:-Y0rch8mN2qLp7sTx}
    ports:
      - "${LAN_BIND_IP:?Set LAN_BIND_IP in .env}:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  streamlit:
    build: .
    container_name: spotify_dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    command:
      [
        "streamlit",
        "run",
        "/app/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]
    ports:
      - "${LAN_BIND_IP:?Set LAN_BIND_IP in .env}:8501:8501"

volumes:
  postgres_data:
